  var $ = function (id) { return document.getElementById(id); };
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function toB64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  async function derive(password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(SALT), iterations: ITER }, base, 256);
    return toB64(new Uint8Array(bits));
  }
  async function decryptPage(keyB64) {
    var key = await crypto.subtle.importKey('raw', unb64(keyB64), 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(IV) }, key, unb64(CT)));
  }
  function show(html, keyB64, persist) {
    try { sessionStorage.setItem(STORE, keyB64); if (persist) localStorage.setItem(STORE, keyB64); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  function forget() { try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) {} }
  function say(text) { var e = $('e'); e.textContent = text; e.hidden = false; }
  async function start() {
    if (!window.crypto || !crypto.subtle) { $('f').hidden = false; say('Потрібне захищене з’єднання (https).'); return; }
    var k = null;
    try { k = sessionStorage.getItem(STORE) || localStorage.getItem(STORE); } catch (e) {}
    if (k) { try { show(await decryptPage(k), k, false); return; } catch (e) { forget(); } }

  }
  $('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var b = $('b'); b.disabled = true; $('e').hidden = true;
    try {
      var k = await derive($('p').value);
      var html;
      try { html = await decryptPage(k); } catch (e) { say('Невірний пароль.'); b.disabled = false; return; }
