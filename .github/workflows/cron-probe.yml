# TEMPORARY (2026-10-02): does GitHub fire cron in a PUBLIC repo of this account? Delete after reading.
name: Cron probe (public repo)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "public probe fired at $(date -u +%H:%M:%S) UTC, event ${{ github.event_name }}, actor ${{ github.actor }}"
